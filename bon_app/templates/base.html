<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category.name }} | Shop</title>
    <style>
        .product-cart {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction:column;

        }

        .itm-container {
            flex-direction: column;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: white;
            border-radius: 16px 16px 0 0;
            width: fit-content;
            gap: 10px;

        }

        img {
            border-radius: 16px;
            transition: transform 0, 4s ease;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            width: 400px;
            height: 220px;
        }

        img:hover {
            transform: scale(1.08);
        }

        button {
            background-color: yellowgreen;
            font-size: large;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-style: oblique;
            text-transform: capitalize;
            padding: 8px 0;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        .nav-bar {
            display: flex;
            gap: 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 15px 5%;
            background: #111827;
            color: white;
            align-items: center;
        }

        nav a {
            text-transform: capitalize;
            padding: 0 8px;
            border-radius: 5px;
            border: 1px solid white;
            font-size: larger;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-decoration: none;
        }
    </style>

</head>

<body>

    {% block content %}
    {% endblock %}

    <input type="hidden" value="{{ csrf_token }}" id="token">

</body>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    // fet ch to add items to cart 
    document.addEventListener('DOMContentLoaded', () => {
        const cart_btns = document.querySelectorAll('.cart-btn');
        const token = document.getElementById('token').value;

        cart_btns.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const id = btn.dataset.id;
                fetch(`/add_to_cart/${id}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`unable to fetch: ${response.status}`)
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success) {
                            alert(data.success);
                        } else {
                            alert(data.error);
                        }
                    })
                    .catch(error => {
                        alert('error:' + error)
                    });
            });
        });

    });
    document.addEventListener('DOMContentLoaded', () => {
        const button = document.querySelectorAll('.buy')
        const token = document.getElementById('token').value;
        button.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const id = btn.dataset.id;
                fetch(`/buy/${id}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    },

                })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`server status ${response.status}: Failed to process purchase.!!`)
                        }
                        return response.json()
                    })

                    .then((order_data) => {
                        if (order_data) {
                            const options = {
                                "key": order_data.key,
                                "amount": order_data.amount,
                                "currency": order_data.currency,
                                "name": "cheri bon_bon",
                                "description": "thanks visit again",
                                "order_id": order_data.order_id,

                                //this handler function runs automatically  when payment is successful//
                                "handler": function (response) {
                                    // call the helper function to send the transaction data to django for verification//
                                    paymentVerification(response);
                                },

                                "theme": {
                                    "color": "#3399cc"
                                }
                            }

                            //initialize and open the razorpay pop up box over your page//
                            const rzp1 = new Razorpay(options);
                            rzp1.open();
                        }

                        else {
                            alert(order_data.error || "an unknown error occurred!");
                        }

                    }).catch((error) => {
                        alert(`ooops ${error}`)
                    });

            });
        });
    });

    // HELPER FUNCTION TO SEND TRANSACTION DATA BACK TO DJANGO FOR VERIFICATION //
    function paymentVerification(razorpayResponse) {
        const id = document.getElementById('token').value
        fetch('signature_check/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': id,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(razorpayResponse)
        }

        ).then((response) => {
            if (!response.ok) {
                throw new Error(`something wrong  ${response.status}`)

                alert(data.error);
            }
        }).catch(error => {
            alert('error' + error)
        })
    }

</script>

</html>
