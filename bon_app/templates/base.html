<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category.name }} | Shop</title>
    <style>
        :root {
            --primary: #4ade80;
            /* Vibrant, fresh green */
            --primary-hover: #22c55e;
            /* Darker green for hover states */
            --dark-bg: #3f463f8c;
            /* Sleek dark slate */
            --text-main: #1f2937;
            --text-muted: #4e535ee5;
            --radius-lg: 16px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Global resets for a clean foundation */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            background-color: #f9fafb;
        }

        /* 🧭 MODERN NAVIGATION BAR */
        nav {
            text-transform: capitalize;
            font-size: large;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-style: oblique;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 5%;
            background: var(--dark-bg);
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            flex-wrap: wrap;
            gap: 12px;
        }

        select {
            outline: none;
            border-radius: 5px;
            text-transform: capitalize;
            font-size: large;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: oblique;
            font-weight: 700;
        }

        .ctg-name h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;

        }

        .nav-bar {
            display: flex;
            gap: 12px;
        }

        nav a {
            text-transform: capitalize;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            text-decoration: none;
            transition: var(--transition);
        }

        nav a:hover {
            background: white;
            color: var(--dark-bg);
            border-color: white;
        }

        /* 📦 RESPONSIVE PRODUCT GRID */
        .product-cart {
            display: grid;
            /* Automatically handles columns based on screen size (desktop, tablet, mobile) */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* 🏷️ INDIVIDUAL PRODUCT CARD */
        .itm-container {
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid #f3f4f6;
            overflow: hidden;
            padding: 16px;
            /* Internal breathing room */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition: var(--transition);
        }

        .itm-container:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        /* Product Title Styling */
        .itm-container h3 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
            line-height: 1.4;
            /* Prevents long titles from breaking the card layout */
            display: -webkit-box;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8rem;
        }

        /* 📷 RESPONSIVE & IMAGE ZOOM EFFECT */
        .itm-container img {
            width: 100%;
            aspect-ratio: 4 / 3;
            /* Perfect standard e-commerce landscape aspect ratio */
            object-fit: cover;
            object-position: center;
            border-radius: calc(var(--radius-lg) - 4px);
            margin-bottom: 16px;
            transition: var(--transition);
            background-color: #f3f4f6;
            /* Fallback skeleton color while loading */
        }

        .itm-container:hover img {
            transform: scale(1.03);
        }

        /* 🛒 E-COMMERCE ACTIONS & BUTTONS */
        .cart-btn,
        .buy {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Primary "Add to Cart" Button */
        .cart-btn {
            background-color: var(--primary);
            color: var(--dark-bg);
            margin-bottom: 8px;
            margin-top: auto;
            /* Always pushes buttons neatly to the bottom */
        }

        .cart-btn:hover {
            background-color: var(--primary-hover);
        }

        .buy:hover {
            background-color: #e5e7eb;
            color: #000;
        }

        /* Styling for your existing buy button */
        .buy {
            background-color: #f3f4f6;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            position: relative;
        }

        /* Pure CSS Circle Spinner */
        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            /* Match your text color */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            /* Gap between "Buy" text and spinner */
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Utility to hide the spinner by default */
        .hidden {
            display: none !important;
        }

        /* Prevent double-clicking while loading */
        .buy:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        dialog {
            border: 1px solid grey;
            border-radius: 5px;
            margin-left: 45%;
            margin-top: 40px;
            padding: 8px;
            background-color: #1f2937;
            color: white;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.3);
            /* Dim the background slightly */
            backdrop-filter: blur(5px);
            /* This blurs the background content */
            transition: all 0.3s ease;
            /* Smooth transition */
        }
    </style>

</head>

<body>
    {% block content %}
    {% endblock %}
    <dialog></dialog>
    <input type="hidden" value="{{ csrf_token }}" id="token">

</body>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    // fetch to add items to cart 
    document.addEventListener('DOMContentLoaded', () => {
        const cart_btns = document.querySelectorAll('.cart-btn');
        const token = document.getElementById('token').value;
        const show_message = document.querySelector('dialog')

        cart_btns.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                let originalContent = btn.innerText
                btn.innerText = 'processing...'
                btn.disabled = true
                e.preventDefault();
                const id = btn.dataset.id;
                fetch(`/add_to_cart/${id}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`unable to fetch: ${response.status}`)
                        }
                        return response.json();
                    })
                    .then(data => {
                        btn.innerText = originalContent
                        btn.disabled = false
                        if (data.success) {
                            show_message.innerText = data.success
                            show_message.showModal()
                            setTimeout(() => {
                                show_message.close()
                            }, 1500);
                        } else {
                            show_message.innerText = data.error
                            show_message.showModal()
                            setTimeout(() => {
                                show_message.close()
                            }, 3000);
                        }
                    })
                    .catch(error => {
                        btn.innerText = originalContent
                        btn.disabled = false
                        show_message.innerText = data.error
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 3000);
                    });
            })
        });

    });

    // fetch to buy items and handle razorpay payment
    document.addEventListener('DOMContentLoaded', () => {
        const button = document.querySelectorAll('.buy')
        const token = document.getElementById('token').value;
        const show_message = document.querySelector('dialog')

        button.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const id = btn.dataset.id;

                // --- 1. GET SPINNER ELEMENTS & TURN ON LOADING STATE ---
                const btnText = btn.querySelector('.btn-text');
                const btnSpinner = btn.querySelector('.btn-spinner');

                // Fallback checking in case span wrappers don't exist yet in HTML
                if (btnText && btnSpinner) {
                    btn.disabled = true;
                    btnSpinner.classList.remove('hidden');
                    btnText.textContent = "Processing...";
                }

                // Helper function to restore the button back to normal
                function resetButtonState() {
                    if (btnText && btnSpinner) {
                        btn.disabled = false;
                        btnSpinner.classList.add('hidden');
                        btnText.textContent = "Buy";
                    }
                }

                fetch(`/buy/${id}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    },
                })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`server status ${response.status}: Failed to process purchase.!!`)
                        }
                        return response.json()
                    })
                    .then((order_data) => {
                        if (order_data) {
                            const options = {
                                "key": order_data.key,
                                "amount": order_data.amount,
                                "currency": order_data.currency,
                                "name": "cheri bon_bon",
                                "description": "thanks visit again",
                                "order_id": order_data.order_id,

                                // This handler function runs automatically when payment is successful
                                "handler": function (response) {
                                    // Reset button when moving forward with verification
                                    resetButtonState();
                                    paymentVerification(response);
                                },

                                // --- 2. RESET BUTTON IF THE USER CLOSES THE POPUP MANUALLY ---
                                "modal": {
                                    "ondismiss": function () {
                                        resetButtonState();
                                    }
                                },

                                "theme": {
                                    "color": "#3399cc"
                                }
                            }

                            // Initialize and open the razorpay pop up box over your page
                            const rzp1 = new Razorpay(options);
                            rzp1.open();

                            // --- 3. SAFETY RESET ---
                            // Since Razorpay covers the viewport, hide the spinner 2 seconds 
                            // after opening so the button is fresh if they return to it.
                            setTimeout(resetButtonState, 2000);
                        }
                        else {
                            show_message.innerText = data.error
                            show_message.showModal()
                            setTimeout(() => {
                                show_message.close()
                            }, 3000);
                            resetButtonState(); // Reset if no order data received
                        }

                    }).catch((error) => {
                        show_message.innerText = error
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 3000);
                        resetButtonState(); // Reset if server network request crashes
                    });

            });
        });
    });

    // HELPER FUNCTION TO SEND TRANSACTION DATA BACK TO DJANGO FOR VERIFICATION //
    function paymentVerification(razorpayResponse) {
        const id = document.getElementById('token').value
        fetch('signature_check/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': id,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(razorpayResponse)
        }

        ).then((response) => {
            if (!response.ok) {
                throw new Error(`something wrong  ${response.status}`)
            }
            return response.json();

        }).then((data) => {
            if (data.success) {
                alert(success);
            } else {
                alert(data.error);
            }
        }).catch(error => {
            alert('error' + error)
        })
    }

</script>

</html>
