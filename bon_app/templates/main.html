{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherri Bon Bon | Toy Store</title>
    <!-- Inside your main.html -->
    <style>
        /* ==========================================
   1. GLOBAL SYSTEM RESET & DESIGN TOKENS
   ========================================== */
        :root {
            --bg-main: #0F1115;
            /* Sleek, modern obsidian black */
            --bg-nav: #161B22;
            /* Amazon dark-slate theme for high contrast */
            --bg-surface: #21262D;
            /* Card surfaces & secondary actions */
            --bg-surface-hover: #2D333B;
            /* Lightened slate for subtle hover states */
            --accent: #FF9900;
            /* Clean premium Amazon Amber accent */
            --accent-hover: #FFB340;
            /* Vibrant bright-orange hover feedback */
            --text-primary: #F0F6FC;
            /* Crisp off-white text for high legibility */
            --text-muted: #8B949E;
            /* Subdued gray for micro-copy and tags */
            --border: #30363D;
            /* Clean, thin charcoal segment borders */
            --radius: 8px;
            /* Contemporary soft rounded corners */
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Hard shutdown of horizontal overflow bugs across the entire device line */
        html,
        body {
            max-width: 100vw;
            overflow-x: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font);
            line-height: 1.5;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* ==========================================
   2. DYNAMIC MOBILE-FIRST NAV BAR (< 768px)
   ========================================== */

        nav {
            display: grid;
            grid-template-columns: 1fr auto;
            /* Clean split configuration on tight viewports */
            gap: 12px;
            align-items: center;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Store Branding Title */
        nav h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #FFFFFF 40%, var(--accent) 100%);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            grid-column: 1;
        }

        nav h1::after {
            content: ".com";
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
            /* Fix override for clipped text gradient */
        }

        .welcome-msg {
            font-size: 0.8rem;
            color: var(--text-primary);
            grid-column: 1;
            margin-top: -8px;
            font-weight: 400;
        }

        /* Amazon Style Select Dropdown Elements */
        nav select {
            grid-column: 1 / span 2;
            /* Spans full horizontal width on phone screen sizes */
            width: 100%;
            height: 42px;
            padding: 0 36px 0 14px;
            font-size: 0.9rem;
            font-weight: 500;
            background-color: #F8F9FA;
            color: #1F2328;
            border: none;
            border-radius: 6px;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%231F2328' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
            cursor: pointer;
            outline: none;
        }

        nav select:focus {
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.4);
        }

        /* Inline Navigation Action Links */
        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            height: 38px;
            border: 1px solid transparent;
        }

        nav a:hover {
            border-color: var(--text-muted);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Layout balancing for specific text options */
        nav a#profile {
            display: none;
        }

        /* Hidden on mobile displays to maximize space */

        nav a#cart {
            grid-column: 2;
            grid-row: 1 / span 2;
            /* Stands vertically centered on the right grid track */
            color: var(--accent);
            font-weight: 700;
            border: 1px solid rgba(255, 153, 0, 0.2);
            background-color: rgba(255, 153, 0, 0.05);
        }

        nav a#cart:hover {
            background-color: rgba(255, 153, 0, 0.1);
            border-color: var(--accent);
        }

        nav a#logout {
            grid-column: 2;
            font-size: 0.8rem;
        }

        /* ==========================================
   3. RESPONSIVE PRODUCT GRID & CONTAINER
   ========================================== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            /* Adaptive auto-packing tracks */
            gap: 16px;
            width: 100%;
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 14px;

        }

        /* Product Card Items container */
        .product-grid>* {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease;
        }

        .product-grid>*:hover {
            transform: translateY(-2px);
            border-color: var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* ==========================================
   4. COMPONENT BUTTONS STYLING
   ========================================== */
        /* Generic buttons template inside the grid architecture */
        .product-grid button,
        dialog button {
            width: 100%;
            padding: 10px 16px;
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 20px;
            /* Modern round capsule shape */
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s active;
            outline: none;
            margin-top: 8px;
        }

        /* Primary "Add to Cart" or Purchase Buttons (Amazon Style) */
        .product-grid button:first-of-type,
        .product-grid button.cart-btn,
        .product-grid button.buy {
            background-color: var(--accent);
            color: #0F1115;
        }

        .product-grid button:first-of-type:hover,
        .product-grid button.cart-btn:hover,
        .product-grid button.buy:hover {
            background-color: var(--accent-hover);
        }

        /* Secondary Button handling if two exist on the card structure */
        .product-grid button:nth-of-type(2) {
            background-color: var(--bg-surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .product-grid button:nth-of-type(2):hover {
            background-color: #3B434D;
        }

        /* Loading/Processing State Style adjustments */
        .product-grid button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: var(--bg-surface-hover) !important;
            color: var(--text-muted) !important;
            border: 1px solid var(--border) !important;
        }

        /* ==========================================
   5. INFINITE SCROLL TARGET & SYSTEM WINDOWS
   ========================================== */
        #scroll-sentinel {
            width: 100%;
            padding: 32px 0;
            text-align: center;
            max-width: 1300px;
            margin: 0 auto;
        }

        .infinite-spinner {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .hidden {
            display: none !important;
        }

        /* Modal Dialog Window Background styling */
        dialog {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin: auto;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        dialog::backdrop {
            background-color: rgba(15, 17, 21, 0.85);
        }

        /* ==========================================
   6. GRADUAL RESPONSIVE BREAKPOINTS (Tablets >= 768px)
   ========================================== */
        @media (min-width: 768px) {
            #nav-container {
                padding: 14px 24px;
            }

            nav {
                display: flex;
                /* Transforms structure into sleek inline line items */
                flex-direction: row;
                justify-content: flex-start;
                gap: 16px;
            }

            nav h1 {
                font-size: 1.6rem;
            }

            .welcome-msg {
                margin: 0;
                font-size: 0.85rem;
            }

            /* Dropdown search container morphs instantly to occupy maximum middle real estate */
            nav select {
                width: auto;
                flex-grow: 1;
                max-width: 550px;
            }

            nav a {
                padding: 0 14px;
            }

            nav a#profile {
                display: inline-flex;
                /* Safely returns to screen layouts */
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                /* Larger fluid cells */
                gap: 20px;
                padding: 0 24px;

            }
        }

        /* ==========================================
   7. LARGE SCREEN CONFIGURATIONS (Desktop >= 1200px)
   ========================================== */
        @media (min-width: 1200px) {
            nav select {
                max-width: 700px;
                /* Sweeping layout allocation across big screen monitors */
            }

            .product-grid {
                grid-template-columns: repeat(4, 1fr);
                /* Locks cleanly into an aesthetic 4-column alignment */
                gap: 24px;

            }
        }


        dialog {
            border: 1px solid grey;
            border-radius: 5px;
            margin-left: 45%;
            margin-top: 40px;
            padding: 8px;
            background-color: #1f2937;
            color: white;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.3);
            /* Dim the background slightly */
            backdrop-filter: blur(5px);
            /* This blurs the background content */
            transition: all 0.3s ease;
            /* Smooth transition */
        }

        #nav-container {
            width: 100%;
            background-color: var(--bg-nav);
            padding: 12px 8px;
            /* Sticky settings */
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
        }

        /* FIX 1: Change from -200% to -100% so it clears exactly its own height */
        .nav-hidden {
            transform: translateY(-100%);
        }

        /* 
        FIX 2: Remove the large 'margin-top: 80px' or '100px' on the grid!
        Because position: sticky keeps the element in the normal page flow at the top,
        large margins push the grid way down, leaving a massive empty gap.
        */
        .product-grid {
            margin-top: 250px;
            /* Just a clean, small gap now */
        }

        @media (min-width: 768px) {
            .product-grid {
                margin-top: 110px;
            }
        }
    </style>
</head>

<body>
    <div id="nav-container">
        <nav>
            <a id="profile" href="#">profile</a>
            <a id="cart" href="{% url 'show_user_cart_items' %}">your Cart</a>
            <a id="logout" href="{% url 'user_log_out' %}" style="color: #f51f1f;">Logout</a>
            <select name="" id="" onchange="if (this.value) location.href = this.value;">
                {% for category in categories %}
                {% if category.slug %}
                <option value="{% url 'category_products_view' category.slug %}">{{ category.name }}</option>
                {% endif %}
                {% endfor %}
            </select>

            <h1>Cheri Bon Bon</h1>
            {% if user %}
            <h4 class="welcome-msg">Welcome, <big>{{user}}</big></h4>
            {% endif %}
        </nav>
    </div>

    <!-- Location: bon_app/templates/main.html -->

    <div id="product-grid" class="product-grid">
        {% include 'partials/product_cards.html' %}
    </div>

    <!-- Clear, Uncluttered Automated Target -->
    <div id="scroll-sentinel" data-next-page="2"
        data-has-next="{% if products.has_next %}true{% else %}false{% endif %}">

        <!-- This spinner text will briefly show ONLY if user out-scrolls the prefetch link -->
        <div class="infinite-spinner hidden">
            Loading more...
        </div>
    </div>
    <dialog></dialog>
    <input type="hidden" name="csrfmiddlewaretoken" id="token" value="{{csrf_token}}">
</body>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const navbar = document.getElementById("nav-container");
        let lastScrollY = window.scrollY;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.scrollY;

            // 1. User scrolls DOWN -> Hide Navbar
            if (currentScrollY > lastScrollY && currentScrollY > 100) {
                navbar.classList.add("nav-hidden");
            }
            // 2. User scrolls UP -> Reveal Navbar
            else if (currentScrollY < lastScrollY) {
                navbar.classList.remove("nav-hidden");
            }

            lastScrollY = currentScrollY;
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        const sentinel = document.getElementById('scroll-sentinel');
        const grid = document.getElementById('product-grid');
        const spinner = sentinel.querySelector('.infinite-spinner');

        let isLoading = false;
        let prefetchedHTML = null;
        grid.addEventListener('click', function (event) {
            // 1. Move the CSRF Token and Button checks to the very top so both blocks can use them safely
            const token = document.getElementById('token').value;
            const buyButton = event.target.closest('.buy');
            const cartButton = event.target.closest('.add-to-cart');
            const show_message = document.querySelector('dialog')

            // ==========================================
            // CASE 1: BUY BUTTON WAS CLICKED
            // ==========================================
            if (buyButton) {
                event.preventDefault();

                // FIX: Variable name matches 'buyButton' perfectly
                const productId = buyButton.getAttribute('data-id');
                let originalhtml = buyButton.innerText
                buyButton.innerText = 'Processing...'
                buyButton.disabled = true

              
                fetch(`/initiate_razorpay_checkout/${productId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    },
                })
                    .then((response) => {
                        if (response.status === 401) {
                            return response.json().then(data => {
                                if (data.authenticated === 'false' && data.next_url) {
                                    window.location.href = data.next_url;
                                }
                            })
                        }
                        else if (!response.ok) {
                            throw new Error(`Server status ${response.status}: Failed to process purchase.!!`);
                        }
                        else {
                            return response.json();
                        }
                    })
                    .then((order_data) => {
                        if (!order_data) {
                            throw new Error('invalid data from server')
                        }
                        buyButton.innerText = originalhtml
                        buyButton.disabled = false
                        if (order_data) {
                            const options = {
                                "key": order_data.key,
                                "amount": order_data.amount,
                                "currency": order_data.currency,
                                "name": "cheri bon_bon",
                                "description": "thanks visit again",
                                "order_id": order_data.order_id,
                                "handler": function (response) {
                                    paymentVerification(response);
                                },
                                "theme": {
                                    "color": "#3399cc"
                                }
                            };
                            const rzp1 = new Razorpay(options);
                            rzp1.open();
                        }
                    })
                    .catch((error) => {
                        buyButton.innerText = originalhtml
                        buyButton.disabled = false
                        show_message.innerText = error.message
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 3000);
                    });
            }

            // ==========================================
            // CASE 2: CHECK IF ADD TO CART BUTTON WAS CLICKED
            // ==========================================
            else if (cartButton) { // FIX: Removed the blocking 'return;' statement
                event.preventDefault();

                const productId = cartButton.getAttribute('data-id');
                const originalhtml = cartButton.innerText
                cartButton.innerText = 'Processing...'
                cartButton.disabled = true
                console.log("Adding product to cart:", productId);

                fetch(`/add_to_cart/${productId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`unable to fetch: ${response.status}`)
                        }
                        return response.json();
                    })
                    .then(data => {
                        cartButton.innerText = originalhtml
                        cartButton.disabled = false
                        show_message.innerText = data.success
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 1000)

                    })
                    .catch(error => {
                        cartButton.innerText = originalhtml
                        cartButton.disabled = false
                        show_message.innerText = error.message
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 3000)
                    });
            }
        });

        // 1. Quietly fetch the next page data in the background
        const prefetchNextPageSilent = () => {
            const hasNext = sentinel.getAttribute('data-has-next') === 'true';
            const nextPage = sentinel.getAttribute('data-next-page');

            if (!hasNext || prefetchedHTML !== null || isLoading) return;

            fetch(`?page=${nextPage}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(response => response.text())
                .then(htmlChunk => {
                    if (htmlChunk.trim() !== "") {
                        prefetchedHTML = htmlChunk;
                    } else {
                        sentinel.setAttribute('data-has-next', 'false');
                    }
                })
                .catch(err => console.log("Background prefetch paused:", err));
        };

        // 2. Render the next batch of product cards onto the screen
        const renderNextChunk = () => {
            const hasNext = sentinel.getAttribute('data-has-next') === 'true';
            const nextPage = sentinel.getAttribute('data-next-page');

            if (isLoading || !hasNext) return;

            // If background prefetch finished, append instantly (0 millisecond delay!)
            if (prefetchedHTML) {
                grid.insertAdjacentHTML('beforeend', prefetchedHTML);
                sentinel.setAttribute('data-next-page', parseInt(nextPage) + 1);
                prefetchedHTML = null; // Reset cache slot

                checkIfStillNearBottom(); // Check if we need to load more immediately
                setTimeout(prefetchNextPageSilent, 100);
                return;
            }

            // Fallback: If network connection is slower than fast scrolling
            isLoading = true;
            spinner.classList.remove('hidden');

            fetch(`?page=${nextPage}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(response => response.text())
                .then(htmlChunk => {
                    if (htmlChunk.trim() === "") {
                        sentinel.setAttribute('data-has-next', 'false');
                        observer.unobserve(sentinel); // Stop observing if out of stock
                    } else {
                        grid.insertAdjacentHTML('beforeend', htmlChunk);
                        sentinel.setAttribute('data-next-page', parseInt(nextPage) + 1);

                        checkIfStillNearBottom();
                    }
                    isLoading = false;
                    spinner.classList.add('hidden');
                    setTimeout(prefetchNextPageSilent, 100);
                })
                .catch(error => {
                    console.error('Error auto-loading toys:', error);
                    isLoading = false;
                    spinner.classList.add('hidden');
                });
        };

        // Safety fallback: if screen is huge and sentinel is still visible, keep loading
        const checkIfStillNearBottom = () => {
            const rect = sentinel.getBoundingClientRect();
            if (rect.top < window.innerHeight + 400) {
                renderNextChunk();
            }
        };

        // 3. Automated Viewport Watcher Engine
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                // Fires immediately when user gets within 800px of the sentinel
                if (entry.isIntersecting) {
                    renderNextChunk();
                }
            });
        }, {
            root: null,
            rootMargin: '800px', // Looks 2 full screens ahead for instant loads
            threshold: 0
        });

        // Start tracking the watchtower div element
        const hasNextInit = sentinel.getAttribute('data-has-next') === 'true';
        if (hasNextInit) {
            observer.observe(sentinel);
        }

        // Seed the first background cache page shortly after landing
        setTimeout(prefetchNextPageSilent, 400);
    });

    // HELPER FUNCTION TO SEND TRANSACTION DATA BACK TO DJANGO FOR VERIFICATION //
    function paymentVerification(razorpayResponse) {
        const id = document.getElementById('token').value
        const show_message = document.querySelector('dialog')
        fetch('cryptographic_signature_check/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': id,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(razorpayResponse)
        }

        ).then((response) => {
            if (!response.ok) {
                throw new Error(`something wrong  ${response.status}`)
            }
            return response.json();

        }).then((data) => {
            show_message.innerText = data.success
            show_message.showModal()
            setTimeout(() => {
                show_message.close()
            }, 3000)

        }).catch(error => {
            show_message.innerText = error
            show_message.showModal()
            setTimeout(() => {
                show_message.close()
            }, 3000)
        })
    }
</script>
