{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherri Bon Bon | Toy Store</title>
    <!-- Inside your main.html -->
    <style>
        /* ==========================================
   1. GLOBAL RESET & OVERFLOW PREVENTION
   ========================================== */
        :root {
            --bg-main: #0F1111;
            /* Amazon's iconic deep dark background */
            --bg-nav: #131921;
            /* Amazon's primary nav block color */
            --bg-surface: #232F3E;
            /* Amazon's secondary nav / card background */
            --bg-card-hover: #2A3A4E;
            --accent: #FF9900;
            /* Premium Amazon Amber / Orange */
            --text-white: #FFFFFF;
            --text-muted: #A7B1C1;
            --radius: 8px;
            --font: 'Inter', system-ui, sans-serif;
        }

        .buy {
            cursor: pointer;
            border-radius: 5px;
            padding: 4px;
        }

        .add-to-cart {
            cursor: pointer;
            border-radius: 5px;
            padding: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Drastically locks down the document viewport to prevent horizontal bleeding */
        html,
        body {
            max-width: 100vw;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: var(--font);
            line-height: 1.4;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ==========================================
   2. MOBILE-FIRST NAVIGATION (Amazon Vibe)
   ========================================== */
        #nav-container {
            width: 100%;
            background-color: var(--bg-nav);
            padding: 12px 8px;
        }

        nav {
            display: grid;
            grid-template-columns: 1fr auto;
            /* Standard mobile layout split */
            gap: 8px;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header/Branding */
        nav h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.03em;
            grid-column: 1;
        }

        nav h1::after {
            content: ".in";
            color: var(--accent);
            font-size: 0.75rem;
        }

        /* Welcome tag sitting beside or under the logo */
        .welcome-msg {
            font-size: 0.8rem;
            color: var(--text-muted);
            grid-column: 1;
            margin-top: -4px;
        }

        /* Amazon-style Category Select Dropdown */
        nav select {
            grid-column: 1 / span 2;
            /* Full width row below logo on small screens */
            width: 100%;
            height: 40px;
            padding: 0 35px 0 12px;
            font-size: 0.9rem;
            background-color: #FAFAFA;
            color: #333333;
            /* Dark text for the bright input box look */
            border: none;
            border-radius: 4px;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23333333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            cursor: pointer;
        }

        nav select:focus {
            outline: 2px solid var(--accent);
        }

        /* Navigation Action Buttons */
        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 8px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 3px;
            border: 1px solid transparent;
        }

        nav a:hover {
            border-color: var(--text-white);
        }

        /* Specific button placements on mobile layout grid */
        nav a#profile {
            display: none;
        }

        /* Kept clean or hidden on compact mobile viewports */

        nav a#cart {
            grid-column: 2;
            grid-row: 1 / span 2;
            /* Stands tall on the right side */
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
        }

        nav a#logout {
            grid-column: 2;
            font-size: 0.75rem;
        }

        /* ==========================================
   3. RESPONSIVE PRODUCT GRID & CONTAINER
   ========================================== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            /* Auto-fluid packing */
            gap: 12px;
            width: 100%;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 12px;
        }

        /* Core setup for the Django child cards inside the grid */
        .product-grid>* {
            background-color: var(--bg-surface);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Safe wrapper rule preventing image burst */
            transition: transform 0.15s ease;
        }

        .product-grid>*:hover {
            transform: scale(1.015);
            background-color: var(--bg-card-hover);
        }

        /* Utility Scroll Sentinel */
        #scroll-sentinel {
            width: 100%;
            padding: 24px 0;
            text-align: center;
            color: var(--text-muted);
        }

        /* ==========================================
   4. GRADUAL BREAKPOINT UPGRADES (Tablets >= 768px)
   ========================================== */
        @media (min-width: 768px) {
            #nav-container {
                padding: 12px 20px;
            }

            nav {
                display: flex;
                /* Switch grid to a streamlined inline flex line */
                flex-direction: row;
                justify-content: flex-start;
                gap: 16px;
            }

            nav h1 {
                font-size: 1.6rem;
            }

            .welcome-msg {
                margin: 0;
                font-size: 0.85rem;
            }

            /* Amazon styling: The search/category input occupies all remaining middle ground space */
            nav select {
                width: auto;
                flex-grow: 1;
                max-width: 600px;
                height: 40px;
            }

            nav a {
                padding: 0 12px;
                height: 40px;
            }

            nav a#profile {
                display: inline-flex;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                /* Larger responsive grid sizes */
                gap: 16px;
                padding: 0 20px;
            }
        }

        #nav-container {
            width: 100%;
            background-color: var(--bg-nav);
            padding: 12px 8px;

            /* --- Add these lines below to enable the smart scroll effect --- */
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            /* Creates the smooth slide effect */
        }

        /* This class will be applied automatically by JavaScript when scrolling down */
        .nav-hidden {
            transform: translateY(-100%);
        }

        /* 
   Crucial: Because the navbar is now 'fixed', it floats on top of the page.
   We must add a top margin to the product grid so it doesn't get hidden underneath!
*/
        .product-grid {
            margin-top: 140px;
            /* Adjust this value if your navbar height changes on desktop */
        }

        @media (min-width: 768px) {
            .product-grid {
                margin-top: 100px;
                /* Thinner navbar on desktop needs less top margin */
            }
        }

        /* ==========================================
   5. BIGGER SCREEN LAYOUTS (Desktop >= 1200px)
   ========================================== */
        @media (min-width: 1200px) {
            nav {
                gap: 24px;
            }

            nav select {
                max-width: 700px;
                /* Expands search block significantly on modern ultra-wide formats */
            }

            .product-grid {
                grid-template-columns: repeat(4, 1fr);
                /* Snaps to 4 structured columns */
                gap: 20px;
            }
        }

        dialog {
            border: 1px solid grey;
            border-radius: 5px;
            margin-left: 45%;
            margin-top: 40px;
            padding: 8px;
            background-color: #1f2937;
            color: white;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.3);
            /* Dim the background slightly */
            backdrop-filter: blur(5px);
            /* This blurs the background content */
            transition: all 0.3s ease;
            /* Smooth transition */
        }
    </style>
</head>

<body>
    <div id="nav-container">
        <nav>
            <a id="profile" href="#">profile</a>
            <a id="cart" href="{% url 'show_user_cart_items' %}">your Cart</a>
            <a id="logout" href="{% url 'user_log_out' %}" style="color: #f51f1f;">Logout</a>
            <select name="" id="" onchange="if (this.value) location.href = this.value;">
                {% for category in categories %}
                {% if category.slug %}
                <option value="{% url 'category_products_view' category.slug %}">{{ category.name }}</option>
                {% endif %}
                {% endfor %}
            </select>

            <h1>Cheri Bon Bon</h1>
            {% if user %}
            <h4 class="welcome-msg">Welcome, {{ user }}</h4>
            {% endif %}
        </nav>
    </div>

    <!-- Location: bon_app/templates/main.html -->

    <div id="product-grid" class="product-grid">
        {% include 'partials/product_cards.html' %}
    </div>

    <!-- Clear, Uncluttered Automated Target -->
    <div id="scroll-sentinel" data-next-page="2"
        data-has-next="{% if products.has_next %}true{% else %}false{% endif %}">

        <!-- This spinner text will briefly show ONLY if user out-scrolls the prefetch link -->
        <div class="infinite-spinner hidden">
            Loading more...
        </div>
    </div>
    <dialog></dialog>
    <input type="hidden" name="csrfmiddlewaretoken" id="token" value="{{csrf_token}}">
</body>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const navbar = document.getElementById("nav-container");
        let lastScrollY = window.scrollY;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.scrollY;

            // 1. User is scrolling DOWNWARDS -> Hide Navbar
            if (currentScrollY > lastScrollY && currentScrollY > 80) {
                navbar.classList.add("nav-hidden");
            }
            // 2. User is scrolling UPWARDS -> Reveal Navbar
            else {
                navbar.classList.remove("nav-hidden");
            }

            // Keep track of the current scroll point for the next movement calculation
            lastScrollY = currentScrollY;
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        const sentinel = document.getElementById('scroll-sentinel');
        const grid = document.getElementById('product-grid');
        const spinner = sentinel.querySelector('.infinite-spinner');

        let isLoading = false;
        let prefetchedHTML = null;
        grid.addEventListener('click', function (event) {
            // 1. Move the CSRF Token and Button checks to the very top so both blocks can use them safely
            const token = document.getElementById('token').value;
            const buyButton = event.target.closest('.buy');
            const cartButton = event.target.closest('.add-to-cart');
            const show_message = document.querySelector('dialog')

            // ==========================================
            // CASE 1: BUY BUTTON WAS CLICKED
            // ==========================================
            if (buyButton) {
                event.preventDefault();

                // FIX: Variable name matches 'buyButton' perfectly
                const productId = buyButton.getAttribute('data-id');
                let originalhtml = buyButton.innerText
                buyButton.innerText = 'Processing...'
                buyButton.disabled = true
                console.log("Processing Razorpay order for Product:", productId);

                fetch(`/initiate_razorpay_checkout/${productId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    },
                })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`Server status ${response.status}: Failed to process purchase.!!`);
                        }
                        return response.json();
                    })
                    .then((order_data) => {
                        if (!order_data) {
                            throw new Error('invalid data from server')
                        }
                        buyButton.innerText = originalhtml
                        buyButton.disabled = false
                        if (order_data) {
                            const options = {
                                "key": order_data.key,
                                "amount": order_data.amount,
                                "currency": order_data.currency,
                                "name": "cheri bon_bon",
                                "description": "thanks visit again",
                                "order_id": order_data.order_id,
                                "handler": function (response) {
                                    paymentVerification(response);
                                },
                                "theme": {
                                    "color": "#3399cc"
                                }
                            };
                            const rzp1 = new Razorpay(options);
                            rzp1.open();
                        }
                    })
                    .catch((error) => {
                        buyButton.innerText = originalhtml
                        buyButton.disabled = false
                        show_message.innerText = error.message
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 3000);
                    });
            }

            // ==========================================
            // CASE 2: CHECK IF ADD TO CART BUTTON WAS CLICKED
            // ==========================================
            else if (cartButton) { // FIX: Removed the blocking 'return;' statement
                event.preventDefault();

                const productId = cartButton.getAttribute('data-id');
                const originalhtml = cartButton.innerText
                cartButton.innerText = 'Processing...'
                cartButton.disabled = true
                console.log("Adding product to cart:", productId);

                fetch(`/add_to_cart/${productId}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`unable to fetch: ${response.status}`)
                        }
                        return response.json();
                    })
                    .then(data => {
                        cartButton.innerText = originalhtml
                        cartButton.disabled = false
                        show_message.innerText = data.success
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 1000)

                    })
                    .catch(error => {
                        cartButton.innerText = originalhtml
                        cartButton.disabled = false
                        show_message.innerText = error.message
                        show_message.showModal()
                        setTimeout(() => {
                            show_message.close()
                        }, 3000)
                    });
            }
        });

        // 1. Quietly fetch the next page data in the background
        const prefetchNextPageSilent = () => {
            const hasNext = sentinel.getAttribute('data-has-next') === 'true';
            const nextPage = sentinel.getAttribute('data-next-page');

            if (!hasNext || prefetchedHTML !== null || isLoading) return;

            fetch(`?page=${nextPage}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(response => response.text())
                .then(htmlChunk => {
                    if (htmlChunk.trim() !== "") {
                        prefetchedHTML = htmlChunk;
                    } else {
                        sentinel.setAttribute('data-has-next', 'false');
                    }
                })
                .catch(err => console.log("Background prefetch paused:", err));
        };

        // 2. Render the next batch of product cards onto the screen
        const renderNextChunk = () => {
            const hasNext = sentinel.getAttribute('data-has-next') === 'true';
            const nextPage = sentinel.getAttribute('data-next-page');

            if (isLoading || !hasNext) return;

            // If background prefetch finished, append instantly (0 millisecond delay!)
            if (prefetchedHTML) {
                grid.insertAdjacentHTML('beforeend', prefetchedHTML);
                sentinel.setAttribute('data-next-page', parseInt(nextPage) + 1);
                prefetchedHTML = null; // Reset cache slot

                checkIfStillNearBottom(); // Check if we need to load more immediately
                setTimeout(prefetchNextPageSilent, 100);
                return;
            }

            // Fallback: If network connection is slower than fast scrolling
            isLoading = true;
            spinner.classList.remove('hidden');

            fetch(`?page=${nextPage}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(response => response.text())
                .then(htmlChunk => {
                    if (htmlChunk.trim() === "") {
                        sentinel.setAttribute('data-has-next', 'false');
                        observer.unobserve(sentinel); // Stop observing if out of stock
                    } else {
                        grid.insertAdjacentHTML('beforeend', htmlChunk);
                        sentinel.setAttribute('data-next-page', parseInt(nextPage) + 1);

                        checkIfStillNearBottom();
                    }
                    isLoading = false;
                    spinner.classList.add('hidden');
                    setTimeout(prefetchNextPageSilent, 100);
                })
                .catch(error => {
                    console.error('Error auto-loading toys:', error);
                    isLoading = false;
                    spinner.classList.add('hidden');
                });
        };

        // Safety fallback: if screen is huge and sentinel is still visible, keep loading
        const checkIfStillNearBottom = () => {
            const rect = sentinel.getBoundingClientRect();
            if (rect.top < window.innerHeight + 400) {
                renderNextChunk();
            }
        };

        // 3. Automated Viewport Watcher Engine
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                // Fires immediately when user gets within 800px of the sentinel
                if (entry.isIntersecting) {
                    renderNextChunk();
                }
            });
        }, {
            root: null,
            rootMargin: '800px', // Looks 2 full screens ahead for instant loads
            threshold: 0
        });

        // Start tracking the watchtower div element
        const hasNextInit = sentinel.getAttribute('data-has-next') === 'true';
        if (hasNextInit) {
            observer.observe(sentinel);
        }

        // Seed the first background cache page shortly after landing
        setTimeout(prefetchNextPageSilent, 400);
    });

    // HELPER FUNCTION TO SEND TRANSACTION DATA BACK TO DJANGO FOR VERIFICATION //
    function paymentVerification(razorpayResponse) {
        const id = document.getElementById('token').value
        const show_message = document.querySelector('dialog')
        fetch('cryptographic_signature_check/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': id,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(razorpayResponse)
        }

        ).then((response) => {
            if (!response.ok) {
                throw new Error(`something wrong  ${response.status}`)
            }
            return response.json();

        }).then((data) => {
            show_message.innerText = data.success
            show_message.showModal()
            setTimeout(() => {
                show_message.close()
            }, 3000)

        }).catch(error => {
            show_message.innerText = error
            show_message.showModal()
            setTimeout(() => {
                show_message.close()
            }, 3000)
        })
    }
</script>
