{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherri Bon Bon | Toy Store</title>
    <!-- Inside your main.html -->
    <style>
        /* 1. Global Themes & Cozy Color Variables */
        :root {
            --amazon-dark: #131921;
            --cozy-amber: #FF9900;
            /* Amazon signature accent */
            --cozy-warm-btn: #FFD814;
            /* Amazon primary action gold */
            --cozy-warm-btn-hover: #F7CA00;
            --wood-warm-bg: #FDFBF7;
            /* Soft warm white background */
            --text-main: #1F1F1F;
            --border-subtle: #E6E1DA;
            --card-shadow: 0 4px 15px rgba(139, 115, 85, 0.08);
            /* Cozy brown-tinted shadow */
        }

        body {
            background-color: var(--wood-warm-bg);
            color: var(--text-main);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* 2. Responsive Navigation Bar (Amazon Layout Style) */
        nav {
            background-color: var(--amazon-dark);
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            /* Allows rows to wrap perfectly on mobile */
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* Store Title Brand Identity */
        nav h1 {
            color: #FFFFFF;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            order: 1;
            /* Places title first */
            letter-spacing: 0.5px;
        }

        /* Navigation Anchors & Select Elements */
        nav a,
        nav select {
            color: #E2E8F0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: #FFFFFF;
            background-color: rgba(255, 255, 255, 0.1);
        }

        nav select {
            background-color: #FFFFFF;
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            padding: 6px 10px;
            outline: none;
            border-radius: 4px;
        }

        /* Align Links / Controls on Desktop */
        #profile {
            order: 2;
            margin-left: auto;
        }

        #cart {
            order: 3;
        }

        nav select {
            order: 4;
        }

        nav a[href*="log_out"] {
            order: 5;
        }

        .welcome-msg {
            color: #A0AEC0;
            font-size: 13px;
            font-weight: 400;
            margin: 0;
            width: 100%;
            /* Drops welcome text to its own neat line */
            order: 6;
            padding-top: 4px;
        }

        /* 3. Optimized Dynamic Product Grid (Flexbox System) */
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            /* CRITICAL: Wraps columns smoothly to prevent squeezing */
            gap: 20px;
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 4. Cozy, Premium Product Cards Layout */
        .product-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            /* Soft rounded cozy corners */
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
            box-shadow: var(--card-shadow);

            /* Desktop Default Column Width (4 Columns) */
            flex: 1 1 calc(25% - 20px);
            min-width: 260px;
            /* Row wraps immediately when space becomes narrow */
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(139, 115, 85, 0.15);
            border-color: #D1C9BC;
        }

        /* Image Scaling Controls inside partials */
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            /* Preserves toy image shapes cleanly */
            background-color: #FAF8F5;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .product-info h3 {
            margin: 0 0 6px 0;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            line-clamp: 2;
            /* Clamps long toy titles to exactly 2 lines maximum */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-info .price {
            margin: 0 0 14px 0;
            font-size: 18px;
            font-weight: 700;
            color: #B12704;
            /* Authentic product price dark red tint */
        }

        .add-to-cart {
            background: var(--cozy-amber);
            border: 1px solid #FCD200;
            border-radius: 20px;
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            margin-bottom: 4px;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 2px 4px rgba(213, 217, 217, .5);
            transition: background-color 0.15s ease;
        }

        /* 5. Pill-Shaped Action Checkout Button */
        .buy {
            background: var(--cozy-warm-btn);
            border: 1px solid #FCD200;
            border-radius: 20px;
            /* Standard Amazon pill shape style */
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 2px 4px rgba(213, 217, 217, .5);
            transition: background-color 0.15s ease;
        }

        .buy:hover {
            background: var(--cozy-warm-btn-hover);
            border-color: #F2C200;
        }

        .buy:disabled {
            background: #F5DF8A;
            border-color: #F3D976;
            cursor: not-allowed;
        }

        /* Razorpay Async Button Spinner CSS Rules */
        .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--text-main);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 6. Infinite Scroll Watchtower Elements */
        #scroll-sentinel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 80px;
            /* Fixed physical footprint space tracking checkpoint */
            margin: 30px 0 50px 0;
            clear: both;
        }

        .infinite-spinner {
            font-size: 14px;
            color: #565959;
            font-weight: 500;
        }

        .amazon-btn {
            background-color: #FFFFFF;
            color: var(--text-main);
            border: 1px solid #D5D9D9;
            border-radius: 8px;
            padding: 12px 35px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(213, 217, 217, .3);
            transition: background-color 0.2s;
        }

        .amazon-btn:hover {
            background-color: #F7FAFA;
        }

        .hidden {
            display: none !important;
        }

        /* ==========================================================================
       7. RESPONSIVE BREAKPOINTS (TABLET & MOBILE OPTIMIZATIONS)
       ========================================================================== */

        /* TABLET DEVICES (Suns out, layout adapts to 2 or 3 items across) */
        @media (max-width: 992px) {
            .product-card {
                flex: 1 1 calc(33.333% - 20px);
                /* 3 Columns on standard tablets */
            }

            nav h1 {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            .product-card {
                flex: 1 1 calc(50% - 20px);
                /* 2 Columns on smaller mini tablet screen limits */
            }

            nav {
                padding: 12px 15px;
            }
        }

        /* SMARTPHONE MOBILE DEVICES (Items scale cleanly into full single blocks) */
        @media (max-width: 540px) {
            nav {
                gap: 10px;
            }

            /* Layout re-ordering: brand layout stacks cleanly on small screens */
            nav h1 {
                width: 100%;
                text-align: center;
                margin-bottom: 5px;
            }

            #profile {
                margin-left: 0;
            }

            /* Reset spacing properties */

            /* Collapse navigation elements to balance nicely */
            #profile,
            #cart,
            nav select,
            nav a[href*="log_out"] {
                flex: 1 1 calc(50% - 10px);
                /* 2 inline items per row cluster layout on mobile */
                text-align: center;
                font-size: 13px;
                padding: 6px 4px;
            }

            .welcome-msg {
                text-align: center;
            }

            .product-grid {
                gap: 15px;
                padding: 0 12px;
                margin: 15px auto;
            }

            .product-card {
                flex: 1 1 100%;
                /* 1 Full Column on phone layouts */
                padding: 12px;
                border-radius: 10px;
            }

            .product-card img {
                height: 170px;
                /* Scales image down slightly to optimize view space */
            }
        }
    </style>
</head>

<body>
    <nav>
        <a id="profile" href="#">profile</a>
        <a id="cart" href="{% url 'user_cart_items' %}">your Cart</a>
        <a href="{% url 'log_out' %}" style="color: #f51f1f;">Logout</a>
        <select name="" id="" onchange="if (this.value) location.href = this.value;">
            {% for category in categories %}
            {% if category.slug %}
            <option value="{% url 'category_products_view' category.slug %}">{{ category.name }}</option>
            {% endif %}
            {% endfor %}
        </select>

        <h1>Cheri Bon Bon</h1>
        {% if user %}
        <h4 class="welcome-msg">Welcome, {{ user }}</h4>
        {% endif %}
    </nav>

    <!-- Location: bon_app/templates/main.html -->

    <div id="product-grid" class="product-grid">
        {% include 'partials/product_cards.html' %}
    </div>

    <!-- Clear, Uncluttered Automated Target -->
    <div id="scroll-sentinel" data-next-page="2"
        data-has-next="{% if products.has_next %}true{% else %}false{% endif %}">

        <!-- This spinner text will briefly show ONLY if user out-scrolls the prefetch link -->
        <div class="infinite-spinner hidden">
            Loading more...
        </div>
    </div>

</body>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sentinel = document.getElementById('scroll-sentinel');
        const grid = document.getElementById('product-grid');
        const spinner = sentinel.querySelector('.infinite-spinner');

        let isLoading = false;
        let prefetchedHTML = null;

        // 1. Quietly fetch the next page data in the background
        const prefetchNextPageSilent = () => {
            const hasNext = sentinel.getAttribute('data-has-next') === 'true';
            const nextPage = sentinel.getAttribute('data-next-page');

            if (!hasNext || prefetchedHTML !== null || isLoading) return;

            fetch(`/main/?page=${nextPage}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(response => response.text())
                .then(htmlChunk => {
                    if (htmlChunk.trim() !== "") {
                        prefetchedHTML = htmlChunk;
                    } else {
                        sentinel.setAttribute('data-has-next', 'false');
                    }
                })
                .catch(err => console.log("Background prefetch paused:", err));
        };

        // 2. Render the next batch of product cards onto the screen
        const renderNextChunk = () => {
            const hasNext = sentinel.getAttribute('data-has-next') === 'true';
            const nextPage = sentinel.getAttribute('data-next-page');

            if (isLoading || !hasNext) return;

            // If background prefetch finished, append instantly (0 millisecond delay!)
            if (prefetchedHTML) {
                grid.insertAdjacentHTML('beforeend', prefetchedHTML);
                sentinel.setAttribute('data-next-page', parseInt(nextPage) + 1);
                prefetchedHTML = null; // Reset cache slot

                checkIfStillNearBottom(); // Check if we need to load more immediately
                setTimeout(prefetchNextPageSilent, 100);
                return;
            }

            // Fallback: If network connection is slower than fast scrolling
            isLoading = true;
            spinner.classList.remove('hidden');

            fetch(`/main/?page=${nextPage}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(response => response.text())
                .then(htmlChunk => {
                    if (htmlChunk.trim() === "") {
                        sentinel.setAttribute('data-has-next', 'false');
                        observer.unobserve(sentinel); // Stop observing if out of stock
                    } else {
                        grid.insertAdjacentHTML('beforeend', htmlChunk);
                        sentinel.setAttribute('data-next-page', parseInt(nextPage) + 1);

                        checkIfStillNearBottom();
                    }
                    isLoading = false;
                    spinner.classList.add('hidden');
                    setTimeout(prefetchNextPageSilent, 100);
                })
                .catch(error => {
                    console.error('Error auto-loading toys:', error);
                    isLoading = false;
                    spinner.classList.add('hidden');
                });
        };

        // Safety fallback: if screen is huge and sentinel is still visible, keep loading
        const checkIfStillNearBottom = () => {
            const rect = sentinel.getBoundingClientRect();
            if (rect.top < window.innerHeight + 400) {
                renderNextChunk();
            }
        };

        // 3. Automated Viewport Watcher Engine
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                // Fires immediately when user gets within 800px of the sentinel
                if (entry.isIntersecting) {
                    renderNextChunk();
                }
            });
        }, {
            root: null,
            rootMargin: '800px', // Looks 2 full screens ahead for instant loads
            threshold: 0
        });

        // Start tracking the watchtower div element
        const hasNextInit = sentinel.getAttribute('data-has-next') === 'true';
        if (hasNextInit) {
            observer.observe(sentinel);
        }

        // Seed the first background cache page shortly after landing
        setTimeout(prefetchNextPageSilent, 400);
    });


    // payment and cart logic
    document.addEventListener('DOMContentLoaded', () => {
        const button = document.querySelectorAll('.buy-btn')
        const token = document.getElementById('token').value;
        button.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const id = btn.dataset.id;
                fetch(`/buy/${id}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    },

                })
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error(`server status ${response.status}: Failed to process purchase.!!`)
                        }
                        return response.json()
                    })

                    .then((order_data) => {
                        if (order_data) {
                            const options = {
                                "key": order_data.key,
                                "amount": order_data.amount,
                                "currency": order_data.currency,
                                "name": "cheri bon_bon",
                                "description": "thanks visit again",
                                "order_id": order_data.order_id,

                                //this handler function runs automatically  when payment is successful//
                                "handler": function (response) {
                                    // call the helper function to send the transaction data to django for verification//
                                    paymentVerification(response);
                                },

                                "theme": {
                                    "color": "#3399cc"
                                }
                            }

                            //initialize and open the razorpay pop up box over your page//
                            const rzp1 = new Razorpay(options);
                            rzp1.open();
                        }

                        else {
                            alert(order_data.error || "an unknown error occurred!");
                        }

                    }).catch((error) => {
                        alert(`ooops ${error}`)
                    });

            });
        });
    });

    // HELPER FUNCTION TO SEND TRANSACTION DATA BACK TO DJANGO FOR VERIFICATION //
    function paymentVerification(razorpayResponse) {
        const id = document.getElementById('token').value
        fetch('signature_check/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': id,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(razorpayResponse)
        }

        ).then((response) => {
            if (!response.ok) {
                throw new Error(`something wrong  ${response.status}`)
            }
            return response.json();

        }).then((data) => {
            if (data.success) {
                alert(success);
            } else {
                alert(data.error);
            }
        }).catch(error => {
            alert('error' + error)
        })
    }

    // fetch to add items to cart 
    document.addEventListener('DOMContentLoaded', () => {
        const cart_btns = document.querySelectorAll('.add-to-cart-btn');
        const token = document.getElementById('token').value;

        cart_btns.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const id = btn.dataset.id;
                fetch(`/add_to_cart/${id}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token,
                        'Content-Type': 'application/json'
                    }
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`unable to fetch: ${response.status}`)
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success) {
                            alert(data.success);
                        } else {
                            alert(data.error);
                        }
                    })
                    .catch(error => {
                        alert('error:' + error)
                    });
            });
        });

    });

    // Sidebar Toggle Logic
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
    }

    // Close sidebar if user clicks outside of it
    document.addEventListener('click', function (event) {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.querySelector('.toggle-btn');
        if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target) && sidebar.classList.contains('open')) {
            sidebar.classList.remove('open');
        }
    });

</script>
